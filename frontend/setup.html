<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XR Analyze 起動</title>
<link rel="stylesheet" href="/static/setup.css" />
</head>
<body>
<!-- 起動画面。カメラと検出モデルを選んでから検出を始める
     (理由: docs/adr/0043-startup-selection-screen.md)。一覧はサーバが
     /setup/options で返し、項目は setup.js が textContent で組み立てる。 -->
<main id="setup">
  <header class="s-head">
    <h1>XR Analyze <span>起 動</span></h1>
    <p class="s-device" id="s-device"></p>
  </header>

  <form id="s-form" novalidate>
    <section class="s-sec" aria-labelledby="h-cam">
      <div class="s-sec-head">
        <h2 id="h-cam">カメラ</h2>
        <button type="button" id="s-refresh" class="s-sub-btn">再読み込み</button>
      </div>
      <p class="s-note" id="s-cam-note">接続中のカメラを調べています...</p>
      <div class="s-cams" id="s-cams" role="radiogroup" aria-labelledby="h-cam"></div>
    </section>

    <section class="s-sec" aria-labelledby="h-model">
      <div class="s-sec-head">
        <h2 id="h-model">検出モデル</h2>
      </div>
      <div class="s-models" id="s-models" role="radiogroup" aria-labelledby="h-model"></div>
      <label class="s-model s-custom">
        <input type="radio" name="model" value="__custom__" id="s-custom-radio" />
        <span class="s-model-body">
          <span class="s-model-name">その他</span>
          <input type="text" id="s-custom" placeholder="ファイル名 または パス (例: yolo11n.pt)"
                 autocomplete="off" spellcheck="false" />
        </span>
      </label>
      <p class="s-note" id="s-model-note"></p>
    </section>

    <div class="s-foot">
      <p class="s-status" id="s-status" role="status" aria-live="polite"></p>
      <button type="submit" id="s-start" class="s-start" disabled>この設定で開始 <kbd>Enter</kbd></button>
    </div>
  </form>
</main>
<script src="/static/setup.js"></script>
</body>
</html>
