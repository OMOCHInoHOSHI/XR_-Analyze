<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XR Analyze</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="stage">
  <!-- annotate=0: 枠とラベルはこのページ側(#overlay)で描くため、映像には焼き込ませない -->
  <img id="video" src="/video?annotate=0" alt="debug video" />
  <!-- カメラ再接続中のオーバーレイ。文言は固定なので JS は .on の付け替えだけを
       行う (理由: docs/adr/0035-camera-auto-reconnect.md) -->
  <div id="reconnect">
    <div class="rc-main">カメラを再接続しています...</div>
    <div class="rc-sub">カメラの接続を確認してください</div>
  </div>
  <div id="overlay"></div>
  <div id="reticle"></div>
  <!-- モードセレクト。環と見出しだけ置き、円周上の項目は起動時に JS が MODES
       から作る (理由: docs/adr/0021-mode-wheel-with-calibration.md) -->
  <div id="wheel">
    <i class="w-ring"></i>
    <i class="w-mark"></i>
    <div class="w-hub"><b>モ ー ド</b>数字で確定 / ←↑↓→ と Enter</div>
  </div>
  <!-- 説明ウィンドウ。単体鑑定で固定した物体のLLM説明を出す。
       タイトルと本文は JS が textContent で差し替える (検出名を扱うため
       innerHTML は使わない)。 -->
  <div id="explain">
    <div class="e-head">
      <span class="e-name" id="e-name"></span>
      <span class="e-key">Enter/Esc で閉じる</span>
    </div>
    <div id="e-body"></div>
    <!-- 読み上げの音声を待っている間だけ出す帯。動く印(dots)は装飾なので
         aria-hidden にする(文言側だけで用は足りる)。 -->
    <div id="e-wait">鑑定士が口を開くまで<span class="e-wait-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
  </div>
  <!-- 調整モードの案内窓。調整モード中だけ中央へ出す。左上の盤に積んでいたが、
       グラスでは中心のほうが読み取りやすい。 -->
  <div id="calib-guide">
    <div class="e-head">
      <span class="e-name">調 整</span>
      <span class="e-key">c / Esc で終える</span>
    </div>
    <div class="cg-row"><span class="cg-key">←↑↓→</span>切り抜き位置</div>
    <div class="cg-row"><span class="cg-key">+ / -</span>ズーム</div>
    <div class="cg-row"><span class="cg-key">f / v</span>文字サイズ</div>
    <div class="cg-row"><span class="cg-key">0</span>リセット</div>
    <div class="cg-row"><span class="cg-key">s</span>保存</div>
    <div class="cg-row"><span class="cg-key">m</span>モードへ</div>
  </div>
  <!-- 鑑定盤。DOMは固定で、render() が中身のテキストだけを差し替える
       (検出名を扱うため innerHTML は使わない)。 -->
  <div id="ui">
    <div id="panel">
      <i class="p-deco"></i>
      <div class="p-head">
        <span class="p-title">鑑 定 眼</span><span id="p-state">待機</span>
      </div>
      <div><span class="p-key">鑑定法</span><span id="p-modename">広域鑑定</span></div>
      <div class="p-credit">VOICEVOX:青山龍星</div>
      <div class="p-msg" id="p-msg"></div>
    </div>
    <div id="hud">connecting…</div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
