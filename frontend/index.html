<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XR Analyze</title>
<style>
  /* AR(XREAL Air2Pro)では黒(#000)が光学シースルーで透明になる。
     デバッグ映像をOFFにすると枠だけが現実に重なる想定。 */
  html, body { margin: 0; height: 100%; background: #000; color: #0f0;
    font-family: -apple-system, "Helvetica Neue", sans-serif; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  /* デバッグ用MJPEG映像。AR表示時は 'd' キーで非表示にする。 */
  #video { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; display: block; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hud { position: absolute; top: 8px; left: 10px; font-size: 13px;
    text-shadow: 0 0 2px #000; pointer-events: none; }
  .box { position: absolute; border: 3px solid #00ff66; box-sizing: border-box; }
  .label { position: absolute; transform: translateY(-100%);
    background: #00ff66; color: #000; font-size: 28px; font-weight: 700;
    line-height: 1.2; padding: 2px 8px; white-space: nowrap;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Yu Gothic", Meiryo, sans-serif; }
</style>
</head>
<body>
<div id="stage">
  <!-- annotate=0: 枠とラベルはこのページ側(#overlay)で描くため、映像には焼き込ませない -->
  <img id="video" src="/video?annotate=0" alt="debug video" />
  <div id="overlay"></div>
  <div id="hud">connecting…</div>
</div>

<script>
// キー操作:
//   d        : デバッグ映像のON/OFF (AR表示は OFF にして黒背景+枠だけにする)
//   + / = / -: デジタルズームの増減
//   ↑↓←→    : 切り抜き位置(表示位置)の移動
//   s        : 現在のズーム/位置を保存 (次回起動時に自動で復元)
//   0        : ズーム・位置をリセット
// ズーム/位置はサーバ側のカメラ切り抜きを動かすので、映像も検出枠も一緒に動く。
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const hud = document.getElementById("hud");
let showVideo = true;

const STEP_ZOOM = 0.1;
const STEP_OFFSET = 0.01;

// 保存結果などの一時メッセージ。HUDはWS受信ごとに描き直されるため、
// 期限(ms)を持たせて render() 側で合成する。
let toastText = "";
let toastUntil = 0;
let lastPayload = null;  // 直近のWSペイロード(WS受信を待たずに描き直すため)

function toast(text, ms = 2000) {
  toastText = text;
  toastUntil = Date.now() + ms;
  // 新フレームが来ないと /ws は送信しないので、カメラが止まっている時でも
  // 保存結果が見えるよう、直近のペイロードで即座に描き直す。
  if (lastPayload) {
    render(lastPayload);
    setTimeout(() => {
      if (lastPayload && Date.now() >= toastUntil) render(lastPayload);
    }, ms + 50);  // 期限切れでメッセージを消すための描き直し
  }
}

// 調整はサーバに差分で投げるだけ。確定値は WS ペイロードの view で受け取るため
// ここでは状態を持たない(クランプ後の実値とHUD表示が必ず一致する)。
function calib(body) {
  fetch("/calib", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  }).catch(() => {}); // 一時的な失敗は次のキー操作で取り戻せるので握りつぶす
}

// 現在値をサーバ側のファイルへ保存する。保存できたかどうかは調整のやり直しに
// 直結するので、こちらは結果をHUDに出す。
function saveCalib() {
  fetch("/calib/save", { method: "POST" })
    .then((r) => r.json())
    .then((d) => {
      toast(d.status === "ok" ? `saved → ${d.file}` : "save failed");
    })
    .catch(() => toast("save failed"));
}

document.addEventListener("keydown", (e) => {
  // 修飾キー付きはブラウザ標準ショートカットなので触らない。特に macOS の
  // Cmd+0 / Cmd+= / Cmd+- (ページの拡大縮小) を拾うと、調整中の値が
  // 意図せずリセットされてしまう。
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.key) {
    case "d":
      showVideo = !showVideo;
      video.style.display = showVideo ? "block" : "none";
      break;
    case "+": case "=":
      calib({ dzoom: STEP_ZOOM });
      break;
    case "-":
      calib({ dzoom: -STEP_ZOOM });
      break;
    // 切り抜き位置を動かす向き。↑ なら「より上」が見えるようになる
    // (check_camera の w/a/s/d と同じ意味)。
    case "ArrowUp":
      e.preventDefault(); calib({ dy: -STEP_OFFSET });
      break;
    case "ArrowDown":
      e.preventDefault(); calib({ dy: STEP_OFFSET });
      break;
    case "ArrowLeft":
      e.preventDefault(); calib({ dx: -STEP_OFFSET });
      break;
    case "ArrowRight":
      e.preventDefault(); calib({ dx: STEP_OFFSET });
      break;
    case "s":
      saveCalib();
      break;
    case "0":
      calib({ reset: true });
      break;
  }
});

const signed = (v) => (v < 0 ? "" : "+") + v.toFixed(2);

function render(payload) {
  lastPayload = payload;
  const stage = document.getElementById("stage");
  const W = stage.clientWidth, H = stage.clientHeight;
  overlay.innerHTML = "";
  for (const d of payload.detections) {
    const box = document.createElement("div");
    box.className = "box";
    box.style.left = (d.x * W) + "px";
    box.style.top = (d.y * H) + "px";
    box.style.width = (d.w * W) + "px";
    box.style.height = (d.h * H) + "px";
    const label = document.createElement("div");
    label.className = "label";
    // 日本語表示名(label_ja)を優先。無ければ英語ラベル。
    const name = d.label_ja || d.label;
    label.textContent = `${name} ${(d.confidence * 100) | 0}%`;
    box.appendChild(label);
    overlay.appendChild(box);
  }
  const v = payload.view;
  const calibText = v
    ? ` | zoom ${v.zoom.toFixed(2)} off(${signed(v.offset_x)},${signed(v.offset_y)})`
    : "";
  const toastPart = Date.now() < toastUntil ? ` | ${toastText}` : "";
  hud.textContent =
    `fps ${payload.fps} | objects ${payload.detections.length}${calibText}` +
    toastPart +
    ` | 'd':映像ON/OFF  +/-:ズーム  ←↑↓→:位置  s:保存  0:リセット`;
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => render(JSON.parse(ev.data));
  ws.onclose = () => { hud.textContent = "disconnected — retrying…";
    setTimeout(connect, 1000); };
}
connect();
</script>
</body>
</html>
